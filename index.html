<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゼンゼロ ディスク最適化計算機 Ver.3.4</title>
    <style>
        :root {
            --bg-color: #121318;
            --card-bg: #1e2029;
            --accent-color: #ff5500;
            --accent-hover: #ff7733;
            --text-color: #e0e0e0;
            --sub-text: #999;
            --border-color: #333644;
            --highlight: #00e676;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 1.8rem;
        }

        .version-badge {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            vertical-align: middle;
            margin-left: 8px;
        }

        .role-badge {
            display: inline-block;
            background-color: #334155;
            color: #38bdf8;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 5px;
        }

        .api-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid var(--border-color);
        }

        input[type="text"], select, input[type="number"] {
            background: #2a2d3d;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--sub-text);
        }

        .form-group input, .form-group select {
            width: 100%;
            box-sizing: border-box;
        }

        .disc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .disc-card {
            background: #252836;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .disc-card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #fff;
        }

        .result-box {
            background: #1a271d;
            border: 1px solid var(--highlight);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .result-title {
            color: var(--highlight);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ゼンゼロ ドライバディスク最適化計算機 <span class="version-badge">Ver.3.4</span></h1>
            <p style="color: var(--sub-text); font-size: 0.9rem;">鋭御「多重会心」機能 & 特性別計算モデル対応</p>
        </header>

        <!-- API取得セクション -->
        <div class="api-section">
            <label for="uid-input">Enka / HoYoLAB UID:</label>
            <input type="text" id="uid-input" placeholder="UIDを入力 (例: 1301050483)" style="width: 200px;">
            <button onclick="fetchEnkaData()">データ取得</button>
            <span id="api-status" style="font-size: 0.85rem; color: var(--sub-text);"></span>
        </div>

        <div class="grid-layout">
            <!-- 左カラム：ステータス & 設定 -->
            <div>
                <div class="card">
                    <h2>キャラクター設定</h2>
                    <div class="form-group">
                        <label>エージェント選択</label>
                        <select id="agent-select" onchange="applyPreset()">
                            <option value="claretta">クラレッタ (電気/鋭御)</option>
                            <option value="jane">ジェーン (物理/異常)</option>
                            <option value="miyabi">星見雅 (氷/異常)</option>
                            <option value="zhu_yuan">朱鳶 (エーテル/強攻)</option>
                            <option value="yuma">浅羽悠真 (電気/強攻)</option>
                            <option value="gigen">儀玄 (エーテル/命破)</option>
                            <option value="caesar">シーザー (物理/防護)</option>
                        </select>
                        <div id="role-display" class="role-badge">特性判定: 鋭御型 (多重会心)</div>
                    </div>
                    
                    <div id="dynamic-inputs">
                        <!-- JSで判定特性に応じた入力フィールドを動的生成 -->
                    </div>

                    <div class="form-group">
                        <label>チーム編成バフ (ステータス補正%)</label>
                        <input type="number" id="buff-percent" value="20" placeholder="%" onchange="calculateOptimal()">
                    </div>
                </div>

                <!-- 計算結果 -->
                <div class="card">
                    <h2>計算結果</h2>
                    <div id="recommendation-result" class="result-box">
                        <div class="result-title">評価スコア</div>
                        <div id="opt-details">計算中...</div>
                    </div>
                </div>
            </div>

            <!-- 右カラム：ディスク試算 -->
            <div>
                <div class="card">
                    <h2>メインステータス設定</h2>
                    <div class="disc-grid">
                        <!-- ディスク 4番 -->
                        <div class="disc-card">
                            <h3>ディスク [4]</h3>
                            <div class="form-group">
                                <label>メインステータス</label>
                                <select id="disc4-main" onchange="calculateOptimal()">
                                    <option value="crit_rate">会心率 (+24%)</option>
                                    <option value="crit_dmg">会心ダメージ (+48%)</option>
                                    <option value="def_percent">防御力 (+30%)</option>
                                    <option value="ap">異常マスタリー (+92)</option>
                                    <option value="atk_percent">攻撃力 (+30%)</option>
                                    <option value="hp_percent">HP (+30%)</option>
                                </select>
                            </div>
                        </div>

                        <!-- ディスク 5番 -->
                        <div class="disc-card">
                            <h3>ディスク [5]</h3>
                            <div class="form-group">
                                <label>メインステータス</label>
                                <select id="disc5-main" onchange="calculateOptimal()">
                                    <option value="elem_bonus">属性ダメージ (+30%)</option>
                                    <option value="def_percent">防御力 (+30%)</option>
                                    <option value="pen_percent">貫通率 (+24%)</option>
                                    <option value="atk_percent">攻撃力 (+30%)</option>
                                    <option value="hp_percent">HP (+30%)</option>
                                </select>
                            </div>
                        </div>

                        <!-- ディスク 6番 -->
                        <div class="disc-card">
                            <h3>ディスク [6]</h3>
                            <div class="form-group">
                                <label>メインステータス</label>

                                <select id="disc6-main" onchange="calculateOptimal()">
                                    <option value="def_percent">防御力 (+30%)</option>
                                    <option value="anom_am">異常掌握 (+30%)</option>
                                    <option value="atk_percent">攻撃力 (+30%)</option>
                                    <option value="energy_regen">エネルギー自動回復 (+60%)</option>
                                    <option value="hp_percent">HP (+30%)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>ステータス総計（試算値）</h2>
                    <div id="total-stats" style="line-height: 1.8; font-size: 0.95rem;">
                        <!-- JSで動的生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PRESETS = {
            claretta: { role: '鋭御', baseDef: 1100, critRate: 20, critDmg: 60, d4: 'crit_rate', d5: 'elem_bonus', d6: 'def_percent' },
            jane: { role: '異常', baseAtk: 1593, baseAp: 148, d4: 'ap', d5: 'elem_bonus', d6: 'anom_am' },
            miyabi: { role: '異常', baseAtk: 1650, baseAp: 114, d4: 'ap', d5: 'elem_bonus', d6: 'anom_am' },
            zhu_yuan: { role: '強攻', baseAtk: 1710, critRate: 5, critDmg: 50, d4: 'crit_dmg', d5: 'elem_bonus', d6: 'atk_percent' },
            yuma: { role: '強攻', baseAtk: 1680, critRate: 5, critDmg: 50, d4: 'crit_rate', d5: 'elem_bonus', d6: 'atk_percent' },
            gigen: { role: '命破', baseHp: 12500, critRate: 5, critDmg: 50, d4: 'crit_rate', d5: 'hp_percent', d6: 'hp_percent' },
            caesar: { role: '防護', baseAtk: 1500, baseHp: 11000, d4: 'atk_percent', d5: 'atk_percent', d6: 'atk_percent' }
        };

        function applyPreset() {
            const agentKey = document.getElementById('agent-select').value;
            const data = PRESETS[agentKey];
            
            document.getElementById('role-display').innerText = `特性判定: ${data.role}型${data.role === '鋭御' ? ' (多重会心有効)' : ''}`;
            
            const container = document.getElementById('dynamic-inputs');
            container.innerHTML = '';

            if (data.role === '鋭御') {
                container.innerHTML = `
                    <div class="form-group"><label>基礎防御力</label><input type="number" id="base-def" value="${data.baseDef}" onchange="calculateOptimal()"></div>
                    <div class="form-group"><label>基礎会心率 (%)</label><input type="number" id="base-cr" value="${data.critRate}" onchange="calculateOptimal()"></div>
                    <div class="form-group"><label>基礎会心ダメージ (%)</label><input type="number" id="base-cd" value="${data.critDmg}" onchange="calculateOptimal()"></div>
                `;
            } else if (data.role === '強攻') {
                container.innerHTML = `
                    <div class="form-group"><label>基礎攻撃力</label><input type="number" id="base-atk" value="${data.baseAtk}" onchange="calculateOptimal()"></div>
                    <div class="form-group"><label>基礎会心率 (%)</label><input type="number" id="base-cr" value="${data.critRate}" onchange="calculateOptimal()"></div>
                    <div class="form-group"><label>基礎会心ダメージ (%)</label><input type="number" id="base-cd" value="${data.critDmg}" onchange="calculateOptimal()"></div>
                `;
            } else if (data.role === '異常') {
                container.innerHTML = `
                    <div class="form-group"><label>基礎攻撃力</label><input type="number" id="base-atk" value="${data.baseAtk}" onchange="calculateOptimal()"></div>
                    <div class="form-group"><label>基礎異常マスタリー</label><input type="number" id="base-ap" value="${data.baseAp}" onchange="calculateOptimal()"></div>
                `;
            } else if (data.role === '命破') {
                container.innerHTML = `
                    <div class="form-group"><label>基礎HP</label><input type="number" id="base-hp" value="${data.baseHp}" onchange="calculateOptimal()"></div>
                    <div class="form-group"><label>基礎会心率 (%)</label><input type="number" id="base-cr" value="${data.critRate}" onchange="calculateOptimal()"></div>
                    <div class="form-group"><label>基礎会心ダメージ (%)</label><input type="number" id="base-cd" value="${data.critDmg}" onchange="calculateOptimal()"></div>
                `;
            } else {
                container.innerHTML = `
                    <div class="form-group"><label>基礎攻撃力</label><input type="number" id="base-atk" value="${data.baseAtk || 1500}" onchange="calculateOptimal()"></div>
                `;
            }

            document.getElementById('disc4-main').value = data.d4;
            document.getElementById('disc5-main').value = data.d5;
            document.getElementById('disc6-main').value = data.d6;

            calculateOptimal();
        }

        function calculateOptimal() {
            const agentKey = document.getElementById('agent-select').value;
            const role = PRESETS[agentKey].role;
            const buff = parseFloat(document.getElementById('buff-percent').value) || 0;

            const d4 = document.getElementById('disc4-main').value;
            const d5 = document.getElementById('disc5-main').value;
            const d6 = document.getElementById('disc6-main').value;

            let addAtkP = 0, addHpP = 0, addDefP = 0, addAp = 0, addCr = 0, addCd = 0, addElem = 0, addAm = 0;

            [d4, d5, d6].forEach(stat => {
                if (stat === 'atk_percent') addAtkP += 30;
                if (stat === 'hp_percent') addHpP += 30;
                if (stat === 'def_percent') addDefP += 30;
                if (stat === 'ap') addAp += 92;
                if (stat === 'crit_rate') addCr += 24;
                if (stat === 'crit_dmg') addCd += 48;
                if (stat === 'elem_bonus') addElem += 30;
                if (stat === 'anom_am') addAm += 30;
            });

            let score = 0;
            let statsSummary = '';

            if (role === '鋭御') {
                const baseDef = parseFloat(document.getElementById('base-def')?.value || 0);
                const baseCr = parseFloat(document.getElementById('base-cr')?.value || 5);
                const baseCd = parseFloat(document.getElementById('base-cd')?.value || 50);

                const finalDef = baseDef * (1 + (addDefP + buff) / 100);
                const finalCr = baseCr + addCr;
                const finalCd = baseCd + addCd;

                // 多重会心計算ロジック
                let critMultiplier = 1;
                if (finalCr <= 100) {
                    critMultiplier = 1 + (finalCr / 100) * (finalCd / 100);
                } else {
                    // 100%超過分で2回目の会心が発生 (多重会心)
                    const overflowCr = finalCr - 100;
                    critMultiplier = (1 + finalCd / 100) + (overflowCr / 100) * (finalCd / 100);
                }

                score = Math.round(finalDef * critMultiplier * (1 + addElem / 100));

                statsSummary = `
                    <div><strong>最終防御力:</strong> ${Math.round(finalDef)}</div>
                    <div><strong>合計会心率:</strong> ${finalCr}% ${finalCr > 100 ? `<span style="color:var(--highlight);">(多重会心発動: +${(finalCr - 100).toFixed(1)}%)</span>` : ''}</div>
                    <div><strong>会心ダメージ:</strong> ${finalCd}%</div>
                    <div><strong>属性ダメージボーナス:</strong> +${addElem}%</div>
                `;
            } else if (role === '強攻') {
                const baseAtk = parseFloat(document.getElementById('base-atk')?.value || 0);
                const baseCr = parseFloat(document.getElementById('base-cr')?.value || 5);
                const baseCd = parseFloat(document.getElementById('base-cd')?.value || 50);

                const finalAtk = baseAtk * (1 + (addAtkP + buff) / 100);
                const finalCr = Math.min(100, baseCr + addCr);
                const finalCd = baseCd + addCd;

                score = Math.round(finalAtk * (1 + (finalCr / 100) * (finalCd / 100)) * (1 + addElem / 100));
                statsSummary = `
                    <div><strong>最終攻撃力:</strong> ${Math.round(finalAtk)}</div>
                    <div><strong>会心率:</strong> ${finalCr}%</div>
                    <div><strong>会心ダメージ:</strong> ${finalCd}%</div>
                    <div><strong>属性ダメージボーナス:</strong> +${addElem}%</div>
                `;
            } else if (role === '異常') {
                const baseAtk = parseFloat(document.getElementById('base-atk')?.value || 0);
                const baseAp = parseFloat(document.getElementById('base-ap')?.value || 0);

                const finalAtk = baseAtk * (1 + (addAtkP + buff) / 100);
                const finalAp = baseAp + addAp;

                score = Math.round(finalAtk * finalAp * (1 + addElem / 100) * (1 + addAm / 100));
                statsSummary = `
                    <div><strong>最終攻撃力:</strong> ${Math.round(finalAtk)}</div>
                    <div><strong>異常マスタリー:</strong> ${finalAp}</div>
                    <div><strong>異常掌握補正:</strong> +${addAm}%</div>
                `;
            } else if (role === '命破') {
                const baseHp = parseFloat(document.getElementById('base-hp')?.value || 0);
                const baseCr = parseFloat(document.getElementById('base-cr')?.value || 5);
                const baseCd = parseFloat(document.getElementById('base-cd')?.value || 50);

                const finalHp = baseHp * (1 + (addHpP + buff) / 100);
                const finalCr = Math.min(100, baseCr + addCr);
                const finalCd = baseCd + addCd;

                score = Math.round((finalHp / 10) * (1 + (finalCr / 100) * (finalCd / 100)) * (1 + addElem / 100));
                statsSummary = `
                    <div><strong>最終HP:</strong> ${Math.round(finalHp)}</div>
                    <div><strong>会心率:</strong> ${finalCr}%</div>
                    <div><strong>会心ダメージ:</strong> ${finalCd}%</div>
                `;
            } else {
                score = 1000;
                statsSummary = `<div>標準モデルで計算中</div>`;
            }

            document.getElementById('total-stats').innerHTML = statsSummary;
            document.getElementById('opt-details').innerHTML = `
                <div>${role}特性向けダメージ期待値: <strong>${score}</strong></div>
                <div style="font-size: 0.85rem; color: #aaa; margin-top: 5px;">※選択された特性および多重会心補正を反映した評価です。</div>
            `;
        }

        async function fetchEnkaData() {
            const uid = document.getElementById('uid-input').value.trim();
            const statusEl = document.getElementById('api-status');
            if (!uid) {
                statusEl.innerText = 'UIDを入力してください';
                return;
            }
            statusEl.innerText = 'データ取得中...';
            try {
                const response = await fetch(`https://enka.network/api/zzz/uid/${uid}`);
                if (!response.ok) throw new Error('通信エラー');
                statusEl.innerText = '取得成功！';
            } catch (err) {
                statusEl.innerText = '取得失敗（プリセット選択をご利用ください）';
            }
        }

        applyPreset();
    </script>
</body>
</html>

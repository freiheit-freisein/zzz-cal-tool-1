<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゼンゼロ ディスク最適化計算機 Ver.4.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ゼンゼロ ドライバディスク最適化計算機 <span class="version-badge">Ver.4.0</span></h1>
            <p style="color: var(--sub-text); font-size: 0.9rem;">ファイル分離構成・二重プロキシ＆JSON直貼り対応</p>
        </header>

        <!-- API取得 & データ取り込みセクション -->
        <div class="api-section">
            <div class="api-controls">
                <label for="uid-input">Enka / HoYoLAB UID:</label>
                <input type="text" id="uid-input" placeholder="例: 1301050483" style="width: 160px;">
                <button onclick="fetchEnkaData()">UID自動取得</button>
                <button onclick="toggleJsonInput()" style="background:#444;">JSON直貼り入力</button>
                <span id="api-status" style="font-size: 0.85rem; color: var(--sub-text);"></span>
            </div>
            <div id="json-box" style="display: none; margin-top: 10px;">
                <textarea id="json-input" placeholder="Enka API等のJSONレスポンスをそのまま貼り付けてください"></textarea>
                <button onclick="importJsonData()" style="margin-top: 5px; padding: 6px 15px; font-size: 0.85rem;">データ解析・反映</button>
            </div>
        </div>

        <div class="grid-layout">
            <!-- 左カラム：エージェント & 敵設定 -->
            <div>
                <div class="card">
                    <h2>エージェント設定</h2>
                    <div class="form-group">
                        <label>プリセット選択</label>
                        <select id="agent-select" onchange="applyPreset()">
                            <option value="claretta">クラレッタ (電気/鋭御)</option>
                            <option value="jane">ジェーン (物理/異常)</option>
                            <option value="zhu_yuan">朱鳶 (エーテル/強攻)</option>
                            <option value="gigen">儀玄 (エーテル/命破)</option>
                        </select>
                        <div id="role-display" class="role-badge">特性: 鋭御型</div>
                    </div>
                    
                    <div id="dynamic-inputs"></div>

                    <div class="form-group">
                        <label>チームバフ 攻撃/HP/防御 (%)</label>
                        <input type="number" id="buff-percent" value="20" onchange="calculateOptimal()">
                    </div>
                </div>

                <div class="card">
                    <h2>敵環境設定</h2>
                    <div class="form-group">
                        <label>敵レベル (標準: 60)</label>
                        <input type="number" id="enemy-level" value="60" onchange="calculateOptimal()">
                    </div>
                    <div class="form-group">
                        <label>敵属性耐性 (%)</label>
                        <input type="number" id="enemy-res" value="0" placeholder="0" onchange="calculateOptimal()">
                    </div>
                    <div class="form-group">
                        <label>ブレイク状態倍率</label>
                        <select id="stun-mult" onchange="calculateOptimal()">
                            <option value="1.0">通常時 (100%)</option>
                            <option value="1.5" selected>ブレイク時 (150%)</option>
                            <option value="2.0">弱点ブレイク時 (200%)</option>
                        </select>
                    </div>
                </div>

                <div class="card">
                    <h2>計算結果</h2>
                    <div id="recommendation-result" class="result-box">
                        <div class="result-title">実数値ダメージ期待値</div>
                        <div id="opt-details">計算中...</div>
                    </div>
                </div>
            </div>

            <!-- 右カラム：ディスクメインステータス試算 -->
            <div>
                <div class="card">
                    <h2>ディスク メインステータス設定</h2>
                    <div class="disc-grid">
                        <div class="disc-card">
                            <h3>ディスク [4]</h3>
                            <div class="form-group">
                                <select id="disc4-main" onchange="calculateOptimal()">
                                    <option value="crit_rate">会心率 (+24%)</option>
                                    <option value="crit_dmg">会心ダメージ (+48%)</option>
                                    <option value="def_percent">防御力 (+30%)</option>
                                    <option value="ap">異常マスタリー (+92)</option>
                                    <option value="atk_percent">攻撃力 (+30%)</option>
                                    <option value="hp_percent">HP (+30%)</option>
                                </select>
                            </div>
                        </div>

                        <div class="disc-card">
                            <h3>ディスク [5]</h3>
                            <div class="form-group">
                                <select id="disc5-main" onchange="calculateOptimal()">
                                    <option value="elem_bonus">属性ダメージ (+30%)</option>
                                    <option value="pen_percent">貫通率 (+24%)</option>
                                    <option value="def_percent">防御力 (+30%)</option>
                                    <option value="atk_percent">攻撃力 (+30%)</option>
                                    <option value="hp_percent">HP (+30%)</option>
                                </select>
                            </div>
                        </div>

                        <div class="disc-card">
                            <h3>ディスク [6]</h3>
                            <div class="form-group">
                                <select id="disc6-main" onchange="calculateOptimal()">
                                    <option value="def_percent">防御力 (+30%)</option>
                                    <option value="anom_am">異常掌握 (+30%)</option>
                                    <option value="atk_percent">攻撃力 (+30%)</option>
                                    <option value="energy_regen">エネルギー回復 (+60%)</option>
                                    <option value="hp_percent">HP (+30%)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>各乗数エリア内訳</h2>
                    <div id="total-stats" style="line-height: 1.8; font-size: 0.9rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

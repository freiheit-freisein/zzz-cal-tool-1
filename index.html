<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゼンゼロ ディスク最適化計算機 (Ver.3.2対応)</title>
    <style>
        :root {
            --bg-color: #121318;
            --card-bg: #1e2029;
            --accent-color: #ff5500;
            --accent-hover: #ff7733;
            --text-color: #e0e0e0;
            --sub-text: #999;
            --border-color: #333644;
            --highlight: #00e676;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        h1 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 1.8rem;
        }

        .version-badge {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            vertical-align: middle;
            margin-left: 8px;
        }

        .api-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid var(--border-color);
        }

        input[type="text"], select, input[type="number"] {
            background: #2a2d3d;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--sub-text);
        }

        .form-group input, .form-group select {
            width: 100%;
            box-sizing: border-box;
        }

        .disc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .disc-card {
            background: #252836;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .disc-card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #fff;
        }

        .result-box {
            background: #1a271d;
            border: 1px solid var(--highlight);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .result-title {
            color: var(--highlight);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ゼンゼロ ドライバディスク最適化計算機 <span class="version-badge">Ver.3.2</span></h1>
            <p style="color: var(--sub-text); font-size: 0.9rem;">UID自動取得 & バランスシミュレーション対応</p>
        </header>

        <!-- API取得セクション -->
        <div class="api-section">
            <label for="uid-input">Enka / HoYoLAB UID:</label>
            <input type="text" id="uid-input" placeholder="UIDを入力 (例: 1301050483)" style="width: 200px;">
            <button onclick="fetchEnkaData()">データ取得</button>
            <span id="api-status" style="font-size: 0.85rem; color: var(--sub-text);"></span>
        </div>

        <div class="grid-layout">
            <!-- 左カラム：ステータス & 設定 -->
            <div>
                <div class="card">
                    <h2>キャラクター設定</h2>
                    <div class="form-group">
                        <label>プリセット選択 (Ver.3.2対応)</label>
                        <select id="agent-select" onchange="applyPreset()">
                            <option value="custom">カスタム（手動入力）</option>
                            <option value="jane">ジェーン (物理/異常)</option>
                            <option value="miyabi">星見雅 (氷/異常)</option>
                            <option value="caesar">シーザー (物理/防護)</option>
                            <option value="zhu_yuan">朱鳶 (エーテル/強攻)</option>
                            <option value="ellen">エレン (氷/強攻)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>基礎攻撃力 (キャラ + 音動機)</label>
                        <input type="number" id="base-atk" value="1593" onchange="calculateOptimal()">
                    </div>
                    <div class="form-group">
                        <label>基礎異常マスタリー</label>
                        <input type="number" id="base-ap" value="148" onchange="calculateOptimal()">
                    </div>
                    <div class="form-group">
                        <label>チーム編成バフ (攻撃力%)</label>
                        <input type="number" id="buff-atk-percent" value="20" placeholder="%" onchange="calculateOptimal()">
                    </div>
                </div>

                <!-- 計算結果 -->
                <div class="card">
                    <h2>メインステータス最適解</h2>
                    <div id="recommendation-result" class="result-box">
                        <div class="result-title">推奨組み合わせ</div>
                        <div id="opt-details">計算中...</div>
                    </div>
                </div>
            </div>

            <!-- 右カラム：ディスク試算 -->
            <div>
                <div class="card">
                    <h2>メインステータス切り替え</h2>
                    <div class="disc-grid">
                        <!-- ディスク 4番 -->
                        <div class="disc-card">
                            <h3>ディスク [4]</h3>
                            <div class="form-group">
                                <label>メインステータス</label>
                                <select id="disc4-main" onchange="calculateOptimal()">
                                    <option value="ap">異常マスタリー (+92)</option>
                                    <option value="crit_rate">会心率 (+24%)</option>
                                    <option value="crit_dmg">会心ダメージ (+48%)</option>
                                    <option value="atk_percent">攻撃力 (+30%)</option>
                                </select>
                            </div>
                        </div>

                        <!-- ディスク 5番 -->
                        <div class="disc-card">
                            <h3>ディスク [5]</h3>
                            <div class="form-group">
                                <label>メインステータス</label>
                                <select id="disc5-main" onchange="calculateOptimal()">
                                    <option value="elem_bonus">属性ダメージ (+30%)</option>
                                    <option value="pen_percent">貫通率 (+24%)</option>
                                    <option value="atk_percent">攻撃力 (+30%)</option>
                                </select>
                            </div>
                        </div>

                        <!-- ディスク 6番 -->
                        <div class="disc-card">
                            <h3>ディスク [6]</h3>
                            <div class="form-group">
                                <label>メインステータス</label>
                                <select id="disc6-main" onchange="calculateOptimal()">
                                    <option value="anom_am">異常掌握 (+30%)</option>
                                    <option value="atk_percent">攻撃力 (+30%)</option>
                                    <option value="energy_regen">エネルギー自動回復 (+60%)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>ステータス総計（試算値）</h2>
                    <div id="total-stats" style="line-height: 1.8; font-size: 0.95rem;">
                        <!-- JSで動的生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PRESETS = {
            jane: { baseAtk: 1593, baseAp: 148, d4: 'ap', d5: 'elem_bonus', d6: 'anom_am' },
            miyabi: { baseAtk: 1650, baseAp: 114, d4: 'crit_rate', d5: 'elem_bonus', d6: 'atk_percent' },
            caesar: { baseAtk: 1500, baseAp: 90, d4: 'atk_percent', d5: 'atk_percent', d6: 'atk_percent' },
            zhu_yuan: { baseAtk: 1710, baseAp: 90, d4: 'crit_dmg', d5: 'elem_bonus', d6: 'atk_percent' },
            ellen: { baseAtk: 1680, baseAp: 90, d4: 'crit_rate', d5: 'elem_bonus', d6: 'atk_percent' }
        };

        function applyPreset() {
            const val = document.getElementById('agent-select').value;
            if (PRESETS[val]) {
                document.getElementById('base-atk').value = PRESETS[val].baseAtk;
                document.getElementById('base-ap').value = PRESETS[val].baseAp;
                document.getElementById('disc4-main').value = PRESETS[val].d4;
                document.getElementById('disc5-main').value = PRESETS[val].d5;
                document.getElementById('disc6-main').value = PRESETS[val].d6;
                calculateOptimal();
            }
        }

        function calculateOptimal() {
            const baseAtk = parseFloat(document.getElementById('base-atk').value) || 0;
            const baseAp = parseFloat(document.getElementById('base-ap').value) || 0;
            const buffAtkPercent = parseFloat(document.getElementById('buff-atk-percent').value) || 0;

            const d4 = document.getElementById('disc4-main').value;
            const d5 = document.getElementById('disc5-main').value;
            const d6 = document.getElementById('disc6-main').value;

            let addAtkPercent = buffAtkPercent;
            let addAp = 0;
            let addElemBonus = 0;

            [d4, d5, d6].forEach(stat => {
                if (stat === 'atk_percent') addAtkPercent += 30;
                if (stat === 'ap') addAp += 92;
                if (stat === 'elem_bonus') addElemBonus += 30;
            });

            const finalAtk = baseAtk * (1 + addAtkPercent / 100);
            const finalAp = baseAp + addAp;

            const score = Math.round(finalAtk * (1 + addElemBonus / 100) * (1 + finalAp / 100));

            document.getElementById('total-stats').innerHTML = `
                <div><strong>最終攻撃力:</strong> ${Math.round(finalAtk)} (+${Math.round(addAtkPercent)}%)</div>
                <div><strong>異常マスタリー:</strong> ${finalAp}</div>
                <div><strong>属性ダメージボーナス:</strong> +${addElemBonus}%</div>
            `;

            document.getElementById('opt-details').innerHTML = `
                <div>現在の評価スコア: <strong>${score}</strong></div>
                <div style="font-size: 0.85rem; color: #aaa; margin-top: 5px;">Ver.3.2基準による期待値算出です。</div>
            `;
        }

        async function fetchEnkaData() {
            const uid = document.getElementById('uid-input').value.trim();
            const statusEl = document.getElementById('api-status');
            if (!uid) {
                statusEl.innerText = 'UIDを入力してください';
                return;
            }

            statusEl.innerText = 'データ取得中...';
            try {
                const response = await fetch(`https://enka.network/api/zzz/uid/${uid}`);
                if (!response.ok) throw new Error('通信エラー');
                statusEl.innerText = '取得成功！';
            } catch (err) {
                statusEl.innerText = '取得失敗（手動プリセットをご利用ください）';
            }
        }

        calculateOptimal();
    </script>
</body>
</html>
